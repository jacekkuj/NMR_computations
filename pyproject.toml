[project]
name = "nmr-computations"
version = "0.2.0"
description = "Streamlit app for parsing Gaussian 1H NMR shieldings and correlating with experimental shifts."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Jacek Kujawski"}]
license = {text = "MIT"}
dependencies = [
  "streamlit>=1.35",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nmr_app"]
